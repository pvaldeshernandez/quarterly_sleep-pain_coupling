name: sleep-pain-coupling
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - pymc=5.27.1
  - arviz=0.23.4
  - numpy=2.3.2
  - scipy=1.16.1
  - pandas=2.3.1
  - matplotlib=3.10.5
  - openpyxl=3.1.5
  - pillow=11.3.0
  - scikit-learn=1.7.1
  - pytensor
  - nibabel=5.3.2
  # Imported by the pipeline but previously undeclared, so an environment built from this
  # file could not run it: nilearn resamples the atlases in steps 14 and 20, statsmodels
  # supplies the FDR correction in step 05, and xarray backs the ArviZ posterior objects.
  - nilearn=0.13.0
  - statsmodels=0.14.6
  - xarray=2026.2.0
